# Local-first stack: Postgres + FastAPI backend + built frontend.
#   docker compose up --build
# Then open http://localhost:5173  (login: demo / demo — change it, see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lawtrack
      POSTGRES_PASSWORD: lawtrack
      POSTGRES_DB: lawtrack
    ports:
      - "5432:5432"
    volumes:
      - lawtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAWTRACK_DATABASE_URL: postgresql+psycopg://lawtrack:lawtrack@db:5432/lawtrack
      LAWTRACK_JWT_SECRET: ${LAWTRACK_JWT_SECRET:-change-me-in-production}
      LAWTRACK_SEED_ON_STARTUP: "true"
    # Live PDF analysis needs Anthropic credentials. They come from `backend/.env` (gitignored), so the
    # key reaches the container without entering the image or this file. Declaring ANTHROPIC_API_KEY
    # under `environment` instead would export an *empty* value whenever the shell doesn't have one —
    # and an empty env var beats the .env file.
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    # Reload on edit: this compose file is the local demo stack, and rebuilding the image for every
    # backend change is the slow path. `uvicorn[standard]` brings the file watcher.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      # Bind-mount (not a named volume): the same blobs must be visible whether the backend runs in
      # this container or as a local `uvicorn`, otherwise uploaded PDFs and page images vanish
      # depending on which one served the upload.
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/pipeline:/app/pipeline

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  lawtrack_pgdata:
